[project]
name = "pyobs-portal"
version = "2.0.0.dev10"
description = "Backend for pyobs robotic software"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "astroplan>=0.10",
    "astropy>=7.2.0",
    "celery>=5.6.3",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    "django-filter>=26.1",
    "djangorestframework>=3.17.1",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "pyobs-auth>=2.0.0.dev9",
    "pyobs-core>=2.0.0.dev95",
    "requests>=2.32.0",
    "unicorn>=2.1.4",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "celery-types>=0.26.0",
    "djangorestframework-stubs>=3.17.0",
]
