[project]
name = "pyobs-robotic-backend"
version = "0.2.22"
description = "Backend for pyobs robotic software"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "astropy>=7.2.0",
    "celery>=5.6.3",
    "django>=6.0.5",
    "django-extensions>=4.1",
    "django-filter>=25.2",
    "djangorestframework>=3.17.1",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "pyobs-core>=1.41.0",
    "unicorn>=2.1.4",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "djangorestframework-stubs>=3.16.9",
]
