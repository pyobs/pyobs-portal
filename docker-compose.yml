services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py collectstatic --no-input &&
             uv run gunicorn pyobs_robotic_backend.wsgi:application --bind 0.0.0.0:8000"
    expose:
      - 8000
    volumes:
      - static_files:/src/static
    env_file: .env
    environment:
      DATABASE: postgres
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: ${POSTGRES_DB}
      SQL_USER: ${POSTGRES_USER}
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
      SQL_HOST: db
      SQL_PORT: 5432
      STATIC_ROOT: /src/static
    depends_on:
      - db
      - rabbitmq

  worker:
    build: .
    restart: unless-stopped
    command: uv run celery -A pyobs_robotic_backend worker --loglevel=info
    env_file: .env
    environment:
      DATABASE: postgres
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: ${POSTGRES_DB}
      SQL_USER: ${POSTGRES_USER}
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
      SQL_HOST: db
      SQL_PORT: 5432
    depends_on:
      - db
      - rabbitmq

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/srv/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_files:
