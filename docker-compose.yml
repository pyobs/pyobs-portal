services:
  web:
    image: ghcr.io/pyobs/pyobs-portal:latest
    command: >
      sh -c "
      uv run manage.py migrate &&
      uv run manage.py collectstatic --no-input &&
      uv run gunicorn -w 4 -b 0.0.0.0:8000 'pyobs_portal.wsgi'
      "
    ports:
      - 8097:8000
    env_file:
      - ./.env
    depends_on:
      - db
      - rabbitmq

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - ./.env

  rabbitmq:
    image: rabbitmq:4.2
    restart: always
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_deprecated_features permit transient_nonexcl_queues true"

  celery:
      image: ghcr.io/pyobs/pyobs-portal:latest
      command: uv run celery -A pyobs_portal worker -B --loglevel INFO --without-gossip --without-mingle --without-heartbeat
      env_file:
        - ./.env
      depends_on:
        - db
        - rabbitmq
      restart: always
      ulimits:
        nofile:
          soft: 4096
          hard: 4096

  task_scheduler:
      image: ghcr.io/pyobs/pyobs-portal:latest
      command: uv run manage.py runscript pyobs_portal.task_scheduler
      env_file:
        - ./.env
      depends_on:
        - db
        - rabbitmq
      restart: always

volumes:
  postgres_data:
