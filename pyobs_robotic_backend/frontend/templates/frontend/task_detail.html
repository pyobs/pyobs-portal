{% extends "frontend/base.html" %}
{% load static %}

{% block title %}Task — pyobs Robotic{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0" id="page-title">Task</h4>
  <div class="d-flex align-items-center">
    <span id="save-status" class="small ms-2"></span>
    <button class="btn btn-sm btn-primary ms-2" id="btn-save">
      <i class="bi bi-save"></i> Save
    </button>
  </div>
</div>

<ul class="nav nav-tabs mb-3">
  <li class="nav-item">
    <button class="nav-link active" type="button" data-bs-toggle="tab" data-bs-target="#tab-task">Task</button>
  </li>
  <li class="nav-item">
    <button class="nav-link" type="button" data-bs-toggle="tab" data-bs-target="#tab-script">Script</button>
  </li>
  <li class="nav-item" id="tab-schedule-nav">
    <button class="nav-link" type="button" data-bs-toggle="tab" data-bs-target="#tab-schedule">Schedule</button>
  </li>
  <li class="nav-item" id="tab-observations-nav">
    <button class="nav-link" type="button" data-bs-toggle="tab" data-bs-target="#tab-observations">Observations</button>
  </li>
</ul>

<div class="tab-content">

  <div class="tab-pane fade show active" id="tab-task">
    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="card border-secondary mb-3">
          <div class="card-header">General</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label small text-secondary mb-1">Code</label>
                <input type="text" class="form-control form-control-sm" id="field-code">
              </div>
              <div class="col-6">
                <label class="form-label small text-secondary mb-1">Project</label>
                <select class="form-select form-select-sm" id="field-project"></select>
              </div>
              <div class="col-12">
                <label class="form-label small text-secondary mb-1">Name</label>
                <input type="text" class="form-control form-control-sm" id="field-name">
              </div>
              <div class="col-4">
                <label class="form-label small text-secondary mb-1">Duration (s)</label>
                <input type="number" step="any" class="form-control form-control-sm" id="field-duration">
              </div>
              <div class="col-4">
                <label class="form-label small text-secondary mb-1">Priority</label>
                <input type="number" step="any" class="form-control form-control-sm" id="field-priority">
              </div>
              <div class="col-4 d-flex align-items-end">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="field-active">
                  <label class="form-check-label small" for="field-active">Active</label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card border-secondary mb-3">
          <div class="card-header">Target</div>
          <div class="card-body" id="target-editor"></div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card border-secondary mb-3">
          <div class="card-header">Constraints</div>
          <div class="card-body" id="constraints-editor"></div>
        </div>

        <div class="card border-secondary mb-3">
          <div class="card-header">Merits</div>
          <div class="card-body" id="merits-editor"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-pane fade" id="tab-script">
    <div class="card border-secondary">
      <div class="card-body" id="script-editor"></div>
    </div>
  </div>

  <div class="tab-pane fade" id="tab-schedule">
    <div class="card border-secondary">
      <div class="card-body p-0">
        <table class="table table-sm table-borderless mb-0" id="schedule-table">
          <thead>
            <tr class="text-muted small">
              <th class="ps-3">Start</th>
              <th>End</th>
              <th>State</th>
              <th>Target</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4" class="text-muted ps-3">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="tab-pane fade" id="tab-observations">
    <div class="card border-secondary">
      <div class="card-body p-0">
        <table class="table table-sm table-borderless mb-0" id="observations-table">
          <thead>
            <tr class="text-muted small">
              <th class="ps-3">Start</th>
              <th>End</th>
              <th>State</th>
              <th>Target</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4" class="text-muted ps-3">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="{% static 'frontend/js/schemaform.js' %}"></script>
<script src="{% static 'frontend/js/taskeditor.js' %}"></script>
<script>
{% if task_id %}
initTaskEditor("{{ task_id|escapejs }}");
{% else %}
initTaskEditor(null);
{% endif %}
</script>
{% endblock %}
