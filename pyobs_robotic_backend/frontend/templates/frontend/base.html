<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pyobs Robotic{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
  <style>
    /* ── Sidebar ─────────────────────────────────────────────────────────── */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background-color: #1a1d21;
      border-right: 1px solid #2d3035;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
    }
    .sidebar-link {
      color: #adb5bd;
      text-decoration: none;
      font-size: 0.875rem;
      border-radius: 6px;
      transition: background-color 0.15s, color 0.15s;
    }
    .sidebar-link:hover  { background-color: #2d3035; color: #f8f9fa; }
    .sidebar-link.active { background-color: #0d6efd20; color: #6ea8fe; }

    /* ── Desktop layout ──────────────────────────────────────────────────── */
    @media (min-width: 992px) {
      body { overflow: hidden; }
      .sidebar      { height: 100vh; overflow-y: auto; }
      .main-content { height: 100vh; overflow-y: auto; }
    }

    /* ── Mobile layout ───────────────────────────────────────────────────── */
    @media (max-width: 991.98px) {
      body { overflow-x: hidden; }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        z-index: 1045;
        width: 280px;
        min-width: 280px;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1044;
    }
    .sidebar-overlay.active { display: block; }

    .status-pill {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

<!-- Mobile top navbar ──────────────────────────────────────────────────── -->
<nav class="d-lg-none d-flex align-items-center px-3 bg-dark border-bottom border-secondary-subtle sticky-top"
     style="height:52px;z-index:1043">
  <i class="bi bi-telescope text-primary me-2"></i>
  <a href="{% url 'frontend:dashboard' %}" class="text-light fw-semibold text-decoration-none me-auto">pyobs Robotic</a>
  <button class="btn btn-outline-secondary btn-sm" onclick="toggleSidebar()">
    <i class="bi bi-list fs-5"></i>
  </button>
</nav>

<!-- Sidebar backdrop (mobile) ─────────────────────────────────────────────── -->
<div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="d-flex">

  <nav class="sidebar" id="sidebar">

    <!-- Desktop header -->
    <div class="p-3 border-bottom border-secondary-subtle d-none d-lg-block">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-telescope fs-5 text-primary"></i>
        <div>
          <div class="fw-semibold text-light lh-1">pyobs</div>
          <div class="text-muted" style="font-size:0.7rem">Robotic Backend</div>
        </div>
      </div>
    </div>

    <!-- Mobile header with close button -->
    <div class="p-3 border-bottom border-secondary-subtle d-flex d-lg-none align-items-center gap-2">
      <i class="bi bi-telescope fs-5 text-primary"></i>
      <div class="me-auto">
        <div class="fw-semibold text-light lh-1">pyobs</div>
        <div class="text-muted" style="font-size:0.7rem">Robotic Backend</div>
      </div>
      <button class="btn btn-sm btn-outline-secondary" onclick="toggleSidebar()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="p-2 flex-grow-1 overflow-auto">

      <div class="px-2 py-2">
        <a href="{% url 'frontend:dashboard' %}"
           class="sidebar-link d-flex align-items-center gap-2 px-2 py-2 {% if active == 'dashboard' %}active{% endif %}">
          <i class="bi bi-grid-fill" style="font-size:0.8rem"></i>
          Dashboard
        </a>
      </div>

      <div class="px-2 pb-1 d-flex align-items-center justify-content-between">
        <a href="{% url 'frontend:task_list' %}" class="text-uppercase text-muted fw-semibold text-decoration-none" style="font-size:0.65rem;letter-spacing:.08em">Tasks</a>
        <div class="d-flex align-items-center gap-1">
          <label for="import-task-file" class="sidebar-link px-1 py-0 lh-1 mb-0" title="Import task from YAML" style="font-size:0.85rem;cursor:pointer">
            <i class="bi bi-upload"></i>
          </label>
          <a href="{% url 'frontend:task_new' %}" class="sidebar-link px-1 py-0 lh-1" title="New task" style="font-size:0.85rem">
            <i class="bi bi-plus-lg"></i>
          </a>
        </div>
      </div>
      <div class="px-2 pb-2" id="sidebar-task-list">
        <div class="text-muted small px-2 py-1">Loading…</div>
      </div>

      {% if request.user.is_superuser %}
      <div class="px-2 pb-1 pt-2">
        <span class="text-uppercase text-muted fw-semibold" style="font-size:0.65rem;letter-spacing:.08em">Admin</span>
      </div>
      <div class="px-2 py-2">
        <a href="{% url 'frontend:admin_projects' %}"
           class="sidebar-link d-flex align-items-center gap-2 px-2 py-2 {% if active == 'admin_projects' %}active{% endif %}">
          <i class="bi bi-folder2-open" style="font-size:0.8rem"></i>
          Projects
        </a>
        <a href="{% url 'frontend:admin_users' %}"
           class="sidebar-link d-flex align-items-center gap-2 px-2 py-2 {% if active == 'admin_users' %}active{% endif %}">
          <i class="bi bi-people-fill" style="font-size:0.8rem"></i>
          Users
        </a>
      </div>
      {% endif %}
    </div>

    <div class="p-2 border-top border-secondary-subtle">
      <form method="post" action="{% url 'frontend:logout' %}">
        {% csrf_token %}
        <button type="submit"
                class="sidebar-link d-flex align-items-center gap-2 px-2 py-2 w-100 border-0 bg-transparent text-start">
          <i class="bi bi-box-arrow-left" style="font-size:0.8rem"></i>
          <span>{{ request.user.username }}</span>
          <span class="ms-auto text-muted small">sign out</span>
        </button>
      </form>
    </div>

  </nav>

  <main class="main-content flex-grow-1 p-3 p-lg-4">
    {% block content %}{% endblock %}
  </main>

</div>

{% load static %}
<input type="file" id="import-task-file" accept=".yaml,.yml" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="{% static 'frontend/js/api.js' %}"></script>
<script>
function getCsrfToken() {
  return document.cookie.split(';')
    .map(c => c.trim())
    .find(c => c.startsWith('csrftoken='))
    ?.replace('csrftoken=', '') || '';
}

function toggleSidebar() {
  const sidebar  = document.getElementById('sidebar');
  const overlay  = document.getElementById('sidebar-overlay');
  const opening  = !sidebar.classList.contains('open');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('active');
  document.body.style.overflow = opening ? 'hidden' : '';
}

document.querySelectorAll('.sidebar-link').forEach(link => {
  link.addEventListener('click', () => {
    if (window.innerWidth < 992 && document.getElementById('sidebar').classList.contains('open')) {
      toggleSidebar();
    }
  });
});

async function loadSidebarTasks() {
  const container = document.getElementById('sidebar-task-list');
  try {
    const [tasks, projects] = await Promise.all([apiList('tasks/'), apiList('projects/')]);
    const projectsByCode = {};
    projects.forEach(p => projectsByCode[p.code] = p);

    const byProject = {};
    tasks.forEach(t => { (byProject[t.project] = byProject[t.project] || []).push(t); });

    container.innerHTML = '';
    if (!tasks.length) {
      container.innerHTML = '<div class="text-muted small px-2 py-1">No tasks.</div>';
      return;
    }

    const currentPath = window.location.pathname;
    Object.keys(byProject).sort().forEach((code, idx) => {
      const proj = projectsByCode[code];
      const group = document.createElement('div');
      group.className = idx > 0 ? 'mt-2' : '';

      const label = document.createElement('div');
      label.className = 'text-muted fw-semibold px-2 py-1 d-flex align-items-center gap-1';
      label.style.cssText = 'font-size:0.65rem;letter-spacing:.06em;text-transform:uppercase;border-top:1px solid #2d3035;' + (idx === 0 ? 'border-top:none;' : '');
      label.innerHTML = `<i class="bi bi-folder2" style="font-size:0.75rem"></i> ${proj ? proj.name : code}`;
      group.appendChild(label);

      byProject[code].sort((a, b) => a.id.localeCompare(b.id)).forEach(task => {
        const a = document.createElement('a');
        a.href = `/tasks/${encodeURIComponent(task.id)}/`;
        a.className = 'sidebar-link d-flex align-items-center px-3 py-1';
        if (currentPath === `/tasks/${encodeURIComponent(task.id)}/`) a.classList.add('active');
        a.style.fontSize = '0.8rem';
        a.textContent = task.name || task.id;
        a.addEventListener('click', () => {
          if (window.innerWidth < 992 && document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
        });
        group.appendChild(a);
      });

      container.appendChild(group);
    });
  } catch(e) {
    container.innerHTML = `<div class="text-muted small px-2 py-1">${e.message}</div>`;
  }
}
loadSidebarTasks();

document.getElementById('import-task-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const text = await file.text();
    const data = jsyaml.load(text);
    sessionStorage.setItem('importTask', JSON.stringify(data));
    window.location.href = '/tasks/new/';
  } catch(err) {
    alert(`Import failed: ${err.message}`);
  }
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
