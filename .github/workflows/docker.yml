name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-push:
    name: Build and push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            ENVIRONMENT=production

      - name: Trigger downstream deployment rebuild
        # Optional: only fires if a deployment has configured these secrets. Generic by
        # design - this repo doesn't know or care which deployment(s) consume it, or how
        # they build/deploy their own image on top of this one. URL and token both live
        # only in repo secrets, never in this file, so no deployment-specific infrastructure
        # detail (which CI system, which project) is visible here.
        if: ${{ secrets.DEPLOY_TRIGGER_URL != '' }}
        run: |
          curl -sf -X POST -F token="${{ secrets.DEPLOY_TRIGGER_TOKEN }}" -F ref=master "${{ secrets.DEPLOY_TRIGGER_URL }}"