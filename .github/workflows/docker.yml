name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-push:
    name: Build and push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            ENVIRONMENT=production

      - name: Trigger downstream deployment rebuilds
        # Optional: only fires if a deployment has configured this secret. Generic by
        # design - this repo doesn't know or care which deployment(s) consume it, or how
        # many, or how they build/deploy their own image on top of this one. DEPLOY_TRIGGERS
        # is a JSON array of {"url": ..., "token": ...} objects, one per downstream
        # deployment; no deployment-specific infrastructure detail (which CI system, which
        # project, how many there are) is visible in this file.
        #
        # `secrets.X` can't be referenced directly in a step `if:` - GitHub Actions rejects
        # the whole workflow file at parse time ("likely failed because of a workflow file
        # issue", no line number given). Routing through `env:` first is the documented
        # workaround.
        if: ${{ env.DEPLOY_TRIGGERS != '' }}
        env:
          DEPLOY_TRIGGERS: ${{ secrets.DEPLOY_TRIGGERS }}
        run: |
          while IFS= read -r target; do
            curl -sf -X POST \
              -F token="$(jq -r '.token' <<<"$target")" \
              -F ref=master \
              "$(jq -r '.url' <<<"$target")"
          done < <(jq -c '.[]' <<<"$DEPLOY_TRIGGERS")